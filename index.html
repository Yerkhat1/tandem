<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0E1218">
<meta name="description" content="Fall 2026 semester tracker: deadlines, timetable and a daily study plan.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tandem">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%99%3C/text%3E%3C/svg%3E">
<title>Tandem</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
:root{
  --ground:#EDEBE6; --panel:#FBFAF7; --panel-2:#F3F1EB; --sunk:#E4E1D9;
  --ink:#181B21; --ink-2:#565C66; --ink-3:#878D97;
  --line:#DBD7CE; --line-2:#E8E5DD;
  --amber:#A96D14; --amber-soft:#F2E3C6; --amber-line:#D8B579;
  --rose:#AC4F65; --rose-soft:#F5DEE3; --rose-line:#D79AA8;
  --ok:#2C7A61; --ok-soft:#DCEDE6;
  --warn:#9C6A12; --warn-soft:#F4E7CC;
  --crit:#AF3D2C; --crit-soft:#F6DED9;
  --phys:#3F58A3; --math:#25776A; --csci:#9A5734; --hst:#7F5090;
  --shadow:0 1px 2px rgba(24,27,33,.05), 0 12px 28px -20px rgba(24,27,33,.35);
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1218; --panel:#161B23; --panel-2:#1B222B; --sunk:#0A0E13;
    --ink:#E9E4DA; --ink-2:#98A2AE; --ink-3:#69727E;
    --line:#252E39; --line-2:#1C232C;
    --amber:#E9A23B; --amber-soft:#33260F; --amber-line:#6B4E1D;
    --rose:#E2899B; --rose-soft:#32191F; --rose-line:#6C3A45;
    --ok:#5BB99B; --ok-soft:#12271F;
    --warn:#DFA54D; --warn-soft:#2C2210;
    --crit:#E0705C; --crit-soft:#301613;
    --phys:#8AA9E0; --math:#5EBBA4; --csci:#D08A6A; --hst:#C08BC0;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 32px -22px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1218; --panel:#161B23; --panel-2:#1B222B; --sunk:#0A0E13;
  --ink:#E9E4DA; --ink-2:#98A2AE; --ink-3:#69727E;
  --line:#252E39; --line-2:#1C232C;
  --amber:#E9A23B; --amber-soft:#33260F; --amber-line:#6B4E1D;
  --rose:#E2899B; --rose-soft:#32191F; --rose-line:#6C3A45;
  --ok:#5BB99B; --ok-soft:#12271F;
  --warn:#DFA54D; --warn-soft:#2C2210;
  --crit:#E0705C; --crit-soft:#301613;
  --phys:#8AA9E0; --math:#5EBBA4; --csci:#D08A6A; --hst:#C08BC0;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 32px -22px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:600; text-wrap:balance; letter-spacing:-.012em}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
a{color:var(--amber)}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

.num{font-family:var(--mono); font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}
.eyebrow{font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3); font-weight:600}

/* ---------- shell ---------- */
.shell{max-width:1180px; margin:0 auto; padding:0 20px 96px}
header.top{
  position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  margin:0 -20px 0; padding:14px 20px 12px;
}
.topbar{display:flex; align-items:center; gap:16px; flex-wrap:wrap; max-width:1180px; margin:0 auto}
.mark{display:flex; align-items:center; gap:9px; margin-right:auto}
.mark svg{display:block; overflow:visible}
.mark .wm{font-family:var(--serif); font-size:26px; letter-spacing:.01em; line-height:1}
.mark .sub{font-size:11px; color:var(--ink-3); letter-spacing:.1em; text-transform:uppercase; font-weight:600; padding-top:5px}
@media(max-width:620px){.mark .sub{display:none}}

.seg{display:inline-flex; background:var(--sunk); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px}
.seg button{
  border:0; background:transparent; color:var(--ink-2); font-size:13px; font-weight:500;
  padding:5px 12px; border-radius:999px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--panel); color:var(--ink); box-shadow:var(--shadow)}
.seg .dotY{width:7px;height:7px;border-radius:50%;background:var(--phys)}
.seg .dotL{width:7px;height:7px;border-radius:50%;background:var(--rose)}

nav.rail{display:flex; gap:4px; overflow-x:auto; padding:10px 0 2px; scrollbar-width:none; max-width:1180px; margin:0 auto}
nav.rail::-webkit-scrollbar{display:none}
nav.rail button{
  border:1px solid transparent; background:transparent; color:var(--ink-2);
  padding:7px 13px; border-radius:999px; font-size:13.5px; font-weight:500; white-space:nowrap;
  display:inline-flex; align-items:center; gap:7px;
}
nav.rail button:hover{color:var(--ink); background:var(--panel-2)}
nav.rail button[aria-current="page"]{background:var(--panel); border-color:var(--line); color:var(--ink); box-shadow:var(--shadow)}
nav.rail .em{font-size:14px; filter:saturate(.9)}

main{padding-top:26px; display:flex; flex-direction:column; gap:22px}
.view-head{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:-4px}
.view-head h1{font-family:var(--serif); font-size:32px; font-weight:400; letter-spacing:0}
.view-head p{margin:0; color:var(--ink-2); font-size:14px; max-width:62ch}

/* ---------- cards ---------- */
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card>.hd{display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--line-2)}
.card>.hd h3{font-size:14px; letter-spacing:.01em}
.card>.hd .sp{margin-left:auto}
.card>.bd{padding:16px}
.card>.bd.tight{padding:8px 16px 14px}
.grid{display:grid; gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}

/* ---------- today strip ---------- */
.strip{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow);
  padding:18px 20px; display:flex; align-items:center; gap:26px; flex-wrap:wrap;
}
.strip .date{display:flex; flex-direction:column; gap:2px; min-width:170px}
.strip .date .d1{font-family:var(--serif); font-size:30px; line-height:1.05}
.strip .date .d2{font-size:12.5px; color:var(--ink-2)}
.strip .stat{display:flex; flex-direction:column; gap:3px}
.strip .stat .v{font-family:var(--mono); font-size:19px; font-weight:500; letter-spacing:-.02em}
.strip .stat .v small{font-size:12px; color:var(--ink-3); font-weight:400}
.strip .divider{width:1px; align-self:stretch; background:var(--line-2)}
@media(max-width:700px){.strip .divider{display:none}}

.countdown.crit{color:var(--crit)} .countdown.warn{color:var(--warn)} .countdown.ok{color:var(--ok)}

/* ---------- pills / chips ---------- */
.chip{
  display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600;
  padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--ink-2); background:var(--panel-2);
  letter-spacing:.02em; white-space:nowrap;
}
.chip.assumed{border-style:dashed; color:var(--ink-3)}
.chip.crit{color:var(--crit); border-color:var(--crit); background:var(--crit-soft)}
.chip.warn{color:var(--warn); border-color:var(--warn-line,var(--warn)); background:var(--warn-soft)}
.chip.ok{color:var(--ok); background:var(--ok-soft); border-color:var(--ok)}
.chip.rose{color:var(--rose); background:var(--rose-soft); border-color:var(--rose-line)}
.dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto}
.c-phys{background:var(--phys)} .c-math{background:var(--math)} .c-csci{background:var(--csci)} .c-hst{background:var(--hst)} .c-other{background:var(--ink-3)}
.t-phys{color:var(--phys)} .t-math{color:var(--math)} .t-csci{color:var(--csci)} .t-hst{color:var(--hst)} .t-other{color:var(--ink-2)}

/* ---------- day timeline ---------- */
.tl{display:flex; flex-direction:column}
.tl .row{display:grid; grid-template-columns:64px 1fr; gap:12px; padding:9px 0; border-top:1px solid var(--line-2)}
.tl .row:first-child{border-top:0}
.tl .tm{font-family:var(--mono); font-size:12px; color:var(--ink-3); padding-top:2px; line-height:1.35}
.tl .body{display:flex; flex-direction:column; gap:3px}
.tl .ttl{font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px}
.tl .meta{font-size:12.5px; color:var(--ink-2)}
.tl .row.class .ttl::before{content:""; width:3px; height:14px; border-radius:2px; background:currentColor; opacity:.65}

/* ---------- study blocks ---------- */
.blocks{display:flex; flex-direction:column; gap:8px}
.blk{
  display:grid; grid-template-columns:auto 62px 1fr auto; gap:12px; align-items:start;
  padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--panel-2);
}
.blk.done{opacity:.5}
.blk.done .b-title{text-decoration:line-through}
.blk .b-time{font-family:var(--mono); font-size:12px; color:var(--ink-2); padding-top:2px; line-height:1.4}
.blk .b-title{font-weight:600; font-size:14px; display:block}
.blk .b-why{font-size:12.5px; color:var(--ink-2); margin-top:2px; display:block}
.blk .b-len{font-family:var(--mono); font-size:12px; color:var(--ink-3)}
.blk.together{background:var(--rose-soft); border-color:var(--rose-line)}
.blk.together .b-why{color:var(--rose)}
.tick{
  appearance:none; width:19px; height:19px; border-radius:6px; border:1.5px solid var(--line);
  background:var(--panel); display:grid; place-items:center; margin:1px 0 0; padding:0; flex:0 0 auto;
}
.tick:hover{border-color:var(--amber)}
.tick[aria-checked="true"]{background:var(--ok); border-color:var(--ok)}
.tick[aria-checked="true"]::after{content:"✓"; color:var(--panel); font-size:12px; font-weight:700; line-height:1}
:root[data-theme="dark"] .tick[aria-checked="true"]::after{color:#0A0E13}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tick[aria-checked="true"]::after{color:#0A0E13}}

.unfit{margin-top:12px; padding:10px 12px; border:1px dashed var(--line); border-radius:10px; font-size:12.5px; color:var(--ink-2); background:var(--sunk)}

/* ---------- week grid ---------- */
.weekwrap{overflow-x:auto; padding-bottom:4px}
.week{display:grid; grid-template-columns:repeat(7,minmax(148px,1fr)); gap:10px; min-width:1040px}
.day{background:var(--panel); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; overflow:hidden}
.day.today{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber)}
.day.off{background:var(--sunk)}
.day.past{opacity:.5}
.day .dh{padding:9px 11px; border-bottom:1px solid var(--line-2); display:flex; align-items:baseline; gap:7px}
.day .dh b{font-size:13px} .day .dh span{font-family:var(--mono); font-size:11.5px; color:var(--ink-3)}
.day .dbody{padding:9px; display:flex; flex-direction:column; gap:6px}
.mini{font-size:11.5px; padding:5px 7px; border-radius:7px; border:1px solid var(--line-2); background:var(--panel-2); line-height:1.3}
.mini.cls{background:transparent; border-style:solid; border-color:var(--line-2); color:var(--ink-2)}
.mini .mt{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); display:block}
.mini.study{border-color:var(--line)}
.mini.tg{background:var(--rose-soft); border-color:var(--rose-line)}
.mini.due{background:var(--crit-soft); border-color:var(--crit); color:var(--crit); font-weight:600}
.loadbar{display:flex; height:6px; border-radius:3px; overflow:hidden; background:var(--sunk); margin-top:2px}
.loadbar i{display:block}

/* ---------- deadline list ---------- */
.dl{display:flex; flex-direction:column}
.dl .item{display:grid; grid-template-columns:auto 88px 1fr auto; gap:13px; align-items:center; padding:11px 16px; border-top:1px solid var(--line-2)}
.dl .item:first-child{border-top:0}
.dl .item.done{opacity:.45}
.dl .item.done .n{text-decoration:line-through}
.dl .when{font-family:var(--mono); font-size:12px; color:var(--ink-2); line-height:1.35}
.dl .n{font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.dl .sub{font-size:12.5px; color:var(--ink-2); margin-top:1px}
.dl .right{display:flex; align-items:center; gap:8px; justify-self:end}
.gh{padding:9px 16px; background:var(--sunk); border-top:1px solid var(--line-2); display:flex; gap:10px; align-items:baseline}
.gh b{font-size:12px; letter-spacing:.02em} .gh span{font-size:11.5px; color:var(--ink-3)}
@media(max-width:620px){
  .dl .item{grid-template-columns:auto 1fr; row-gap:4px}
  .dl .when{grid-column:2} .dl .right{grid-column:2; justify-self:start}
}

/* ---------- history ---------- */
.chunk{display:grid; grid-template-columns:auto 74px 1fr auto; gap:12px; align-items:center; padding:9px 0; border-top:1px solid var(--line-2)}
.chunk:first-of-type{border-top:0}
.chunk .day-l{font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3)}
.chunk .cn{font-size:13.5px}
.chunk.done .cn{text-decoration:line-through; opacity:.55}
.chunk .kind{font-size:11px; color:var(--ink-3); font-family:var(--mono)}
details.wk{border-top:1px solid var(--line-2)}
details.wk summary{padding:11px 16px; cursor:pointer; display:flex; gap:10px; align-items:center; font-size:13.5px; list-style:none}
details.wk summary::-webkit-details-marker{display:none}
details.wk summary::before{content:"›"; color:var(--ink-3); transition:transform .15s; display:inline-block}
details.wk[open] summary::before{transform:rotate(90deg)}
details.wk .in{padding:0 16px 14px 40px}

/* ---------- push cards ---------- */
.push{display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:center}
.ring{width:74px; height:74px; flex:0 0 auto}
.ring text{font-family:var(--mono); font-size:15px; fill:var(--ink); font-weight:500}
.quota{font-family:var(--mono); font-size:22px; letter-spacing:-.02em}
.stepper{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--panel-2)}
.stepper button{border:0; background:transparent; padding:5px 11px; font-size:14px; color:var(--ink-2)}
.stepper button:hover{background:var(--sunk); color:var(--ink)}
.stepper input{border:0; background:transparent; width:56px; text-align:center; font-family:var(--mono); font-size:13px; border-left:1px solid var(--line); border-right:1px solid var(--line)}
.bar{height:7px; border-radius:4px; background:var(--sunk); overflow:hidden; margin:9px 0 4px}
.bar i{display:block; height:100%; background:var(--amber)}

/* ---------- forms ---------- */
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
  background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13.5px; width:100%;
}
.btn{
  border:1px solid var(--line); background:var(--panel-2); color:var(--ink); border-radius:8px;
  padding:7px 13px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:7px;
}
.btn:hover{border-color:var(--amber); color:var(--amber)}
.btn.primary{background:var(--amber); border-color:var(--amber); color:var(--panel)}
:root[data-theme="dark"] .btn.primary{color:#12161C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#12161C}}
.btn.primary:hover{filter:brightness(1.06); color:var(--panel)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-3); font-weight:500}
.btn.ghost:hover{color:var(--crit); border-color:transparent}

/* ---------- misc ---------- */
.note-in{width:100%; background:transparent; border:0; border-bottom:1px dashed var(--line); padding:6px 2px; font-family:var(--serif); font-size:19px}
.note-in::placeholder{color:var(--ink-3); font-family:var(--sans); font-size:14px}
.notecard{background:linear-gradient(180deg, var(--rose-soft), var(--panel)); border-color:var(--rose-line)}
.empty{display:flex; flex-direction:column; align-items:center; gap:10px; padding:26px 16px; color:var(--ink-3); text-align:center; font-size:13.5px}
.rules{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px}
.rules li{display:grid; grid-template-columns:16px 1fr; gap:9px; font-size:13px; color:var(--ink-2); line-height:1.45}
.rules li b{color:var(--ink); font-weight:600}
.rules li::before{content:"—"; color:var(--ink-3)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0; font-family:var(--mono); font-size:12.5px}
.sync{font-size:11.5px; color:var(--ink-3); display:inline-flex; align-items:center; gap:6px}
.sync i{width:6px; height:6px; border-radius:50%; background:var(--ink-3); display:block}
.sync.live i{background:var(--ok)}
footer{margin-top:34px; padding-top:16px; border-top:1px solid var(--line); color:var(--ink-3); font-size:12.5px; display:flex; gap:12px; align-items:center; flex-wrap:wrap}
footer .heart{color:var(--rose)}

/* ---------- self-study routine ---------- */
.rtbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:2px 2px 0}
.rtbar .sp{margin-left:auto}
.rtbar .chip.strong{background:var(--amber-soft); border-color:var(--amber-line); color:var(--ink)}
.banner{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--ink-3);
  border-radius:var(--r); padding:11px 15px; font-size:13.5px; color:var(--ink-2)}
.banner.warn{border-left-color:var(--warn); background:var(--warn-soft); color:var(--ink)}
.banner b{color:var(--ink)}

.rt{display:grid; gap:14px; grid-template-columns:1fr 1fr}
@media(max-width:940px){.rt{grid-template-columns:1fr}}
.dayc{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden}
.dayc.today{border-color:var(--amber-line)}
.dayc .dh{display:flex; align-items:baseline; gap:9px; padding:13px 16px 11px}
.dayc .dh h3{font-size:16px; font-family:var(--serif); font-weight:400; letter-spacing:.01em}
.dayc .dh .dt{font-size:12px; color:var(--ink-3)}
.dayc .dh .now{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--amber);
  border:1px solid var(--amber-line); border-radius:999px; padding:1px 7px}
.dayc .dh .tot{margin-left:auto; font-size:12px; color:var(--ink-3)}

.fixed{display:flex; flex-wrap:wrap; gap:6px; padding:0 16px 12px}
.fixed .fx{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-2);
  background:var(--sunk); border:1px solid var(--line-2); border-radius:999px; padding:3px 9px}
.fixed .fx b{font-weight:500; color:var(--ink-3)}
.fixed .fx .fxt{color:var(--ink-3)}
.fixed .fx.none{color:var(--ink-3); font-style:italic; background:transparent}

.grp{padding:12px 16px 13px; border-top:1px solid var(--line-2)}
.grp .gh{display:flex; align-items:center; gap:8px}
.grp .gh h4{font-size:13.5px}
.grp .gh .slot{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);
  border:1px dashed var(--line); border-radius:999px; padding:1px 7px}

/* =========================================================================
   HELPERS
   ========================================================================= */
const pad=n=>String(n).padStart(2,'0');
const toMin=s=>{const p=s.split(':');return +p[0]*60 + +p[1]};
const toHM=m=>pad(Math.floor(m/60))+':'+pad(Math.round(m%60));
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const parseDT=s=>{const [d,t]=s.split('T');const a=d.split('-').map(Number);const b=(t||'00:00').split(':').map(Number);
  return new Date(a[0],a[1]-1,a[2],b[0],b[1])};
const addDays=(d,n)=>{const x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x};
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const dow=d=>((d.getDay()+6)%7)+1;                       // 1=Mon … 7=Sun
const DAYN=['','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD=d=>DAYN[dow(d)].slice(0,3)+' '+d.getDate()+' '+MON[d.getMonth()];
const short=(s,n)=>{ s=String(s).replace(/\s*\([^)]*\)\s*$/,''); if(s.length<=n) return s;
  const cut=s.slice(0,n); const sp=cut.lastIndexOf(' '); return (sp>n*0.55?cut.slice(0,sp):cut)+'…'; };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hrs=m=>m>=60?(m%60?Math.floor(m/60)+'h '+(m%60)+'m':Math.floor(m/60)+'h'):m+'m';
function weekKey(d){const m=dstr(mondayOf(d)); return WEEKS.includes(m)?m:null}
function weekNo(k){const i=WEEKS.indexOf(k); return i<0?null:i+1}
function isLabWeek(k){return !!((PHYS_WEEK[k]||{}).lab)}
function untilTxt(due){
  const ms=parseDT(due)-NOW;
  if(ms<0) return {txt:'passed', cls:''};
  const h=ms/36e5;
  if(h<24) return {txt:h<1?Math.round(h*60)+' min':Math.round(h)+' h', cls:'crit'};
  const d=Math.round(h/24);
  return {txt:d+' day'+(d===1?'':'s'), cls:d<=3?'warn':d<=10?'':'ok'};
}

/* =========================================================================
   THE PLANNER
   ========================================================================= */
const MODES={
  A:{label:'Steady', hint:'2h physics · 1.5h CS · 1.5h calculus', per:{phys:120,math:90,csci:90,hst:60}},
  B:{label:'Push',   hint:'3h physics · 2h CS · 2h calculus',     per:{phys:180,math:120,csci:120,hst:90}}
};
const DAY_FACTOR={1:1,2:1,3:1,4:1,5:.9,6:.7,7:.55};
const DAY_START=8*60+30, DAY_END=22*60+30;
const MEALS=[[13*60,13*60+45],[18*60+45,19*60+30]];

function classesOn(p,date){
  const k=weekKey(date), lab=k?isLabWeek(k):false, dd=dow(date);
  if(k===BREAK_WEEK||!k) return [];
  return CLASSES[p].filter(c=>c.d===dd && (!c.labWeek || lab))
    .map(c=>Object.assign({},c,{sm:toMin(c.s),em:toMin(c.e)}))
    .sort((a,b)=>a.sm-b.sm);
}
function freeWindows(p,date,extraBusy){
  const busy=classesOn(p,date).map(c=>[c.sm-10,c.em+10]).concat(MEALS).concat(extraBusy||[]);
  busy.sort((a,b)=>a[0]-b[0]);
  const out=[]; let cur=DAY_START;
  busy.forEach(([s,e])=>{ if(s>cur) out.push({s:cur,e:Math.min(s,DAY_END)}); cur=Math.max(cur,e); });
  if(cur<DAY_END) out.push({s:cur,e:DAY_END});
  return out.filter(w=>w.e-w.s>=40);
}
function overlapWindows(a,b){
  const out=[];
  a.forEach(x=>b.forEach(y=>{const s=Math.max(x.s,y.s),e=Math.min(x.e,y.e); if(e-s>=45) out.push({s,e});}));
  return out.sort((x,y)=>x.s-y.s);
}
/* the shared slot: latest evening overlap that fits 75 minutes */
function togetherSlot(date){
  const k=weekKey(date); if(!k||k===BREAK_WEEK) return null;
  if(dow(date)===6) return null;                       // Saturday evening is off the clock
  const wins=overlapWindows(freeWindows('y',date),freeWindows('l',date))
    .map(w=>({s:Math.max(w.s,16*60),e:Math.min(w.e,22*60)})).filter(w=>w.e-w.s>=75);
  if(!wins.length) return null;
  const w=wins[wins.length-1];
  return {s:w.e-75, e:w.e};
}
/* which subject the two of them should sit down with together */
function togetherSubject(date){
  const soon=allItems().filter(it=>it.people.length===2 && !isDone(it.id))
    .map(it=>({it,h:(parseDT(it.due)-date)/36e5})).filter(x=>x.h>-12 && x.h<24*6)
    .sort((a,b)=>a.h-b.h);
  const exam=soon.find(x=>x.it.kind==='exam');
  if(exam) return exam.it.c;
  return 'phys';
}
/* pick what a subject's block is actually about, on a given day */
function subjectFocus(p,c,date){
  const k=weekKey(date);
  const next=allItems().filter(it=>it.c===c && it.people.includes(p) && !isDone(it.id) && it.est>0 && parseDT(it.due)>=date)
    .sort((a,b)=>a.due<b.due?-1:1)[0];
  let title='', why='';
  if(next){
    const u=untilTxt(next.due);
    title=next.title;
    why=(next.kind==='exam'?'Exam in ':'Due in ')+u.txt+' · '+fmtD(parseDT(next.due))+' '+next.due.slice(11);
  }
  const topic = c==='phys' ? (PHYS_WEEK[k]||{}).t : c==='math' ? (MATH_WEEK[k]||{}).t : c==='hst' ? (HST_WEEK[k]||{}).t : null;
  if(!next){ title = topic || COURSES[c].name; why='Stay ahead of this week'; }
  if(c==='hst'){
    const sem=addDays(parseD(k||dstr(date)),2);
    title = topic || title;
    why = 'Lectures + readings before the seminar · Wed '+sem.getDate()+' '+MON[sem.getMonth()]+' 14:00';
  }
  return {title, why, topic, next};
}
function subjectUrgency(p,c,date){
  const f=subjectFocus(p,c,date); if(!f.next) return 1;
  const h=(parseDT(f.next.due)-date)/36e5;
  let u = h<24?1.6 : h<48?1.4 : h<96?1.2 : h<24*8?1.05 : .9;
  if(f.next.kind==='exam' && h<24*8) u=Math.max(u,1.45);
  return u;
}
function planDay(p,date,mode){
  const k=weekKey(date);
  const res={blocks:[], unfit:[], classes:classesOn(p,date), holiday:HOLIDAYS[dstr(date)]||null,
             breakWeek:k===BREAK_WEEK, offSemester:!k};
  if(!k||k===BREAK_WEEK) return res;

  const tg=togetherSlot(date), tgSub=tg?togetherSubject(date):null;
  const tgMine = tg && PEOPLE[p].courses.includes(tgSub) ? tg : null;
  const wins=freeWindows(p,date, tgMine?[[tgMine.s,tgMine.e]]:[]);

  const f=DAY_FACTOR[dow(date)];
  const subs=PEOPLE[p].courses.map(c=>{
    const u=subjectUrgency(p,c,date);
    return {c, u, min:Math.round(MODES[mode].per[c]*f*u/5)*5};
  }).sort((a,b)=>b.u-a.u);

  if(tgMine){ const s=subs.find(x=>x.c===tgSub); if(s) s.min=Math.max(0,s.min-75); }

  const slots=wins.map(w=>({s:w.s,e:w.e,cur:w.s}));
  const roomOf=s=>s.e-s.cur;
  const place=(minutes,dir)=>{
    let left=minutes, placed=[], minStart=DAY_START, prefer=null;
    while(left>=40){
      let size=Math.min(90,left);
      if(left-size<40) size=Math.min(105,left);            // never leave an orphan 20-minute tail
      const fits=s=>roomOf(s)>=Math.min(size,75) && s.cur>=minStart;
      let slot=(prefer&&fits(prefer))?prefer:dir(slots.filter(fits));
      if(!slot) slot=dir(slots.filter(s=>roomOf(s)>=45 && s.cur>=minStart));
      if(!slot) slot=dir(slots.filter(s=>roomOf(s)>=45));
      if(!slot) break;
      const len=Math.min(size, roomOf(slot));
      if(len<40) break;
      placed.push({start:slot.cur,end:slot.cur+len});
      slot.cur+=len+15; left-=len; prefer=slot; minStart=slot.cur;   // the day moves forward
    }
    return {placed,left};
  };
  const early=arr=>arr[0];
  const late =arr=>arr[arr.length-1];

  subs.forEach(sub=>{
    if(sub.min<30) return;
    const foc=subjectFocus(p,sub.c,date);
    const r=place(sub.min, sub.c==='hst'?late:early);
    r.placed.forEach(b=>res.blocks.push({
      c:sub.c, start:b.start, end:b.end, title:foc.title, why:foc.why, topic:foc.topic, together:false
    }));
    if(r.left>=40) res.unfit.push({c:sub.c, min:r.left, title:foc.title});
  });

  if(tgMine){
    const foc=subjectFocus(p,tgSub,date);
    res.blocks.push({c:tgSub, start:tgMine.s, end:tgMine.e, together:true,
      title:foc.title, why:'Same desk, same problem set — you two vs. this one', topic:foc.topic});
  }
  res.blocks.sort((a,b)=>a.start-b.start);
  res.blocks.forEach((b,i)=>b.key='blk:'+p+':'+dstr(date)+':'+i);
  return res;
}

/* history chunks for a given week */
function hstChunks(k){
  const h=HST_WEEK[k]; if(!h) return [];
  const items=h.lec.map(x=>({kind:'lecture',t:x[0],m:x[1]})).concat(h.read.map(x=>({kind:'reading',t:x[0],m:x[1]})));
  if(!items.length) return [];
  // six evenings before Wednesday's seminar: Thu, Fri, Sat, Sun, Mon, Tue
  const seminar=addDays(parseD(k),2);
  const days=[-6,-5,-4,-3,-2,-1].map(n=>addDays(seminar,n));
  const per=Math.ceil(items.length/5);
  const out=[]; let di=0, count=0;
  items.forEach((it,i)=>{
    if(count>=per && di<4){ di++; count=0; }
    out.push(Object.assign({},it,{day:days[di], id:'hst:'+k+':'+i}));
    count++;
  });
  out.push({kind:'drill', t:'Recall drill: define the week\'s terms, one line of evidence per source', m:25,
            day:days[5], id:'hst:'+k+':drill'});
  return out;
}

/* ---------- SELF-STUDY ROUTINE ---------- */
const SUBJ={phys:'Physics',math:'Calculus',csci:'Programming',hst:'History'};
function rtMin(b){return toMin(b[1])-toMin(b[0])}
function rtDayTotal(day){return day.groups.reduce((a,g)=>a+g.blocks.reduce((x,b)=>x+rtMin(b),0),0)}
function rtWeekTotals(p){
  const by={};
  ROUTINE[p].forEach(d=>d.groups.forEach(g=>{by[g.c]=(by[g.c]||0)+g.blocks.reduce((x,b)=>x+rtMin(b),0)}));
  return by;
}
function nextWeekKey(k){const i=WEEKS.indexOf(k); let j=i+1; if(WEEKS[j]===BREAK_WEEK) j++; return WEEKS[j]||null}

/* the reading list a history block covers, and which seminar it is for */
function hstFor(slot,k){
  if(slot==='drill') return null;
  const target=(slot==='sat'||slot==='sun') ? nextWeekKey(k) : k;
  if(!target) return null;
  return {k:target, slot, items:hstSplit(target)[slot]||[], seminar:addDays(parseD(target),2)};
}

      const topic = g.c==='phys'?(PHYS_WEEK[k]||{}).t : g.c==='math'?(MATH_WEEK[k]||{}).t : null;
      h+='<div class="grp">'
       +'<div class="gh"><span class="dot c-'+g.c+'"></span><h4>'+SUBJ[g.c]+'</h4>'
       +'<span class="code">'+COURSES[g.c].code+'</span>'
       +(g.slot?'<span class="slot">recitation slot</span>':'')
       +'<span class="mins num">'+hrs(mins)+'</span></div>'
       +'<p class="why">'+esc(g.why)+'</p>';

      const hs=g.hst?hstFor(g.hst,k):null;
      g.blocks.forEach(b=>{
        h+='<div class="blk"><span class="tm num">'+b[0]+'–'+b[1]+'</span><div class="wt">';
        if(hs){
          h+='<span class="fortag">for the seminar on Wed '+hs.seminar.getDate()+' '+MON[hs.seminar.getMonth()]+' · '
            +esc(short((HST_WEEK[hs.k]||{}).t||'',38))+'</span>';
          if(hs.slot==='consolidate'){
            h+='<div class="it"><span class="k notes">notes</span>Fill whatever the reading slots did not reach</div>'
             +'<div class="it"><span class="k notes">terms</span>Write the week’s terms, one line of evidence per source</div>'
             +'<div class="it"><span class="k notes">plan</span>Draft the 100–200 word answer you would write tomorrow</div>';
          }else if(hs.items.length) hs.items.forEach(it=>h+='<div class="it"><span class="k '+it.kind+'">'+it.kind+'</span>'
            +esc(short(it.t,64))+'<span class="m num">'+it.m+'m</span></div>');
          else h+='<div class="it"><span class="k notes">notes</span>Nothing new set this week — re-read and consolidate</div>';
        }else{
          h+=esc(b[2]);
          if(topic) h+='<span class="topic">'+esc(short(topic,72))+'</span>';
        }
        h+='</div></div>';
      });
      h+='</div>';
    });
    if(dow(date)===5) h+='<div class="grp off">Friday evening is not a study block ♥</div>';
    h+='</section>';
  });
  h+='</div>';
  h+='<p class="foot-note">The times are the routine, not the law: if a block slips, move it inside the same day — '
    +'the order is what keeps the deadlines safe.</p>';
  return h;
}

/* both, side by side — where the two routines line up */
function planBoth(mon,k,wn){
  const days=[0,1,2,3,4,5,6].map(n=>addDays(mon,n));
  let h='<div class="view-head"><h1>Self-study</h1><p>Both routines side by side. '
   +'Rose means you are on the same subject at the same time — that is the block to sit at one desk for.</p></div>';
  h+='<div class="rtbar"><span class="eyebrow">Week of '+mon.getDate()+' '+MON[mon.getMonth()]+(wn?' · week '+wn:'')+'</span>'
   +'<span class="sp"></span>'
   +['y','l'].map(p=>{const t=rtWeekTotals(p);const s=Object.keys(t).reduce((a,c)=>a+t[c],0);
      return '<span class="chip">'+PEOPLE[p].name+' '+hrs(s)+'</span>';}).join('')+'</div>';
  h+='<div class="cmp"><div class="ch"><span></span><span>Yerkhat</span><span>Lashyn</span></div>';
  days.forEach((date,i)=>{
    const today=dstr(date)===dstr(NOW);
    const rows=['y','l'].map(p=>ROUTINE[p][i]);
    const flat=rows.map(d=>d.groups.reduce((a,g)=>a.concat(g.blocks.map(b=>({c:g.c,s:toMin(b[0]),e:toMin(b[1])}))),[]));
    const tg=flat[0].some(x=>flat[1].some(y=>y.c===x.c && Math.min(x.e,y.e)-Math.max(x.s,y.s)>=45));
    h+='<div class="cr'+(today?' today':'')+'"><div class="cd"><b>'+DAYN[dow(date)].slice(0,3)+'</b>'
      +'<span class="num">'+date.getDate()+'</span>'+(tg?'<span class="tgm">♥</span>':'')+'</div>';
    rows.forEach((d,ri)=>{
      h+='<div class="cc">';
      d.groups.forEach(g=>{
        const mins=g.blocks.reduce((x,b)=>x+rtMin(b),0);
        const together = flat[1-ri].some(y=>y.c===g.c &&
          g.blocks.some(b=>Math.min(toMin(b[1]),y.e)-Math.max(toMin(b[0]),y.s)>=45));
        h+='<div class="cb'+(together?' tg':'')+'"><span class="tm num">'+g.blocks[0][0]+'</span>'
          +'<span class="dot c-'+g.c+'"></span>'+COURSES[g.c].code.split(' ')[0]
          +'<span class="m num">'+hrs(mins)+'</span></div>';
      });
      h+='</div>';
    });
    h+='</div>';
  });
  h+='</div>';
  return h;
}

function render(){
  NOW=new Date();
  document.getElementById('whoSeg').innerHTML=
    [['y','<span class="dotY"></span>Yerkhat'],['l','<span class="dotL"></span>Lashyn'],['both','Both']]
    .map(([v,l])=>'<button data-who="'+v+'" aria-pressed="'+(WHO===v)+'">'+l+'</button>').join('');
  document.getElementById('modeSeg').style.display = VIEW==='plan' ? 'none' : '';
  document.getElementById('modeSeg').innerHTML=
    Object.keys(MODES).map(m=>'<button data-mode="'+m+'" aria-pressed="'+(S.mode===m)+'" title="'+MODES[m].hint+'">'+MODES[m].label+'</button>').join('');
  document.getElementById('nav').innerHTML=
    VIEWS.map(v=>'<button data-view="'+v.id+'"'+(VIEW===v.id?' aria-current="page"':'')+'><span class="em">'+v.em+'</span>'+v.label+'</button>').join('');
  const m=document.getElementById('main');
  m.innerHTML = VIEW==='plan'?vPlan(): VIEW==='today'?vToday(): VIEW==='week'?vWeek(): VIEW==='due'?vDue():
                VIEW==='hist'?vHist(): VIEW==='push'?vPush(): vRef();
  document.getElementById('fortune').textContent=FORTUNES[NOW.getDate()%FORTUNES.length];
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-view],[data-who],[data-mode],[data-tick],[data-del],[data-push],[data-delpush],#addItem,#addPush,#exportCsv');
  if(!t) return;
  if(t.dataset.view){ VIEW=t.dataset.view; if(VIEW==='hist') WHO='l'; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.who){ WHO=t.dataset.who; render(); return; }
  if(t.dataset.mode){ S.mode=t.dataset.mode; persist(); render(); return; }
  if(t.dataset.tick){ toggleDone(t.dataset.tick); return; }
  if(t.dataset.del){ S.custom=(S.custom||[]).filter(c=>c.id!==t.dataset.del); persist(); render(); return; }
  if(t.dataset.delpush){ S.pushes=(S.pushes||[]).filter(p=>p.id!==t.dataset.delpush); persist(); render(); return; }
  if(t.dataset.push){
    const p=(S.pushes||[]).find(x=>x.id===t.dataset.push); if(!p) return;
    p.done=Math.max(0,Math.min(p.total, p.done + Number(t.dataset.inc))); persist(); render(); return;
  }
  if(t.id==='addItem'){
    const title=document.getElementById('nTitle').value.trim(); if(!title) return;
    const who=document.getElementById('nWho').value;
    S.custom=(S.custom||[]).concat([{
      id:'x'+Date.now(), title, c:document.getElementById('nCourse').value,
      due:document.getElementById('nDate').value+'T'+document.getElementById('nTime').value,
      est:Number(document.getElementById('nEst').value)||1,
      people: who==='both'?['y','l']:[who], kind:'task', note:''
    }]);
    persist(); render(); return;
  }
  if(t.id==='addPush'){
    const title=document.getElementById('pTitle').value.trim(); if(!title) return;
    S.pushes=(S.pushes||[]).concat([{id:'p'+Date.now(), title, total:Number(document.getElementById('pTotal').value)||10,
      unit:document.getElementById('pUnit').value||'items', due:document.getElementById('pDue').value, done:0, c:'other'}]);
    persist(); render(); return;
  }
  if(t.id==='exportCsv'){ exportCsv(t); return; }
});
document.addEventListener('change',e=>{
  if(e.target.dataset.pushval){
    const p=(S.pushes||[]).find(x=>x.id===e.target.dataset.pushval); if(!p) return;
    p.done=Math.max(0,Math.min(p.total,Number(e.target.value)||0)); persist(); render();
  }
  if(e.target.dataset.note){ S.notes[e.target.dataset.note]=e.target.value.slice(0,140); persist(); }
});

async function exportCsv(btn){
  const rows=[['Subject','Start Date','Start Time','End Date','End Time','All Day Event','Description','Location']];
  allItems().filter(it=>!isDone(it.id)).forEach(it=>{
    const d=parseDT(it.due), end=new Date(d.getTime()+30*6e4);
    const date=(x)=>pad(x.getMonth()+1)+'/'+pad(x.getDate())+'/'+x.getFullYear();
    const time=(x)=>pad(x.getHours())+':'+pad(x.getMinutes())+':00';
    rows.push([COURSES[it.c]?COURSES[it.c].code+' · '+it.title:it.title, date(d), time(d), date(end), time(end),
      'False', (it.note||'')+' [for '+it.people.map(p=>PEOPLE[p].name).join(' & ')+']', '']);
  });
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  let dl=null; try{ dl = window.claude&&claude.use ? await claude.use('downloads') : null; }catch(e){}
  if(dl){
    try{ await dl.save({filename:'tandem-deadlines.csv', data:csv}); btn.textContent='Saved — import it in Google Calendar'; }
    catch(err){ btn.textContent = err && err.code==='declined' ? 'Export for Google Calendar' : 'Export unavailable here'; }
  }else{
    const blob=new Blob([csv],{type:'text/csv'}), a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='tandem-deadlines.csv'; a.click(); URL.revokeObjectURL(a.href);
  }
}

loadLocal();
render();
initDB();
setInterval(()=>{ if(VIEW==='today') render(); }, 60000);
</script>
