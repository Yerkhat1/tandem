:root{
  --bg:#FBF7F4;
  --g1:#FFD9C7; --g2:#E2DBFF; --g3:#CFEFE6; --g4:#FFE6F0;

  --ink:#2A2536; --ink-2:#686277; --ink-3:#A29CAF;
  --line:rgba(120,105,150,.13); --edge:rgba(255,255,255,.75);
  --accent:#7B6AF2; --accent-2:#E87FB0; --accent-soft:rgba(123,106,242,.12);
  --warn:#C8613A; --warn-soft:rgba(240,140,100,.16);

  --r:18px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13121A;
    --g1:#4A2552; --g2:#232E66; --g3:#133F45; --g4:#3A1F40;
    --card:rgba(32,30,44,.62); --card-solid:#201E2C; --soft:rgba(255,255,255,.06);
    --ink:#EEEAF4; --ink-2:#ABA5BA; --ink-3:#736D84;
    --line:rgba(255,255,255,.07); --edge:rgba(255,255,255,.06);
    --accent:#A597FF; --accent-2:#F29BC4; --accent-soft:rgba(165,151,255,.15);
    --warn:#F2A07A; --warn-soft:rgba(242,160,122,.13);
    --ok:#6BD3A8;
    --phys:#93A9FF; --math:#6FD6BC; --csci:#F7B48E; --hst:#CDA9F5;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -16px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#13121A;
  --g1:#4A2552; --g2:#232E66; --g3:#133F45; --g4:#3A1F40;
  --card:rgba(32,30,44,.62); --card-solid:#201E2C; --soft:rgba(255,255,255,.06);
  --ink:#EEEAF4; --ink-2:#ABA5BA; --ink-3:#736D84;
  --line:rgba(255,255,255,.07); --edge:rgba(255,255,255,.06);
  --accent:#A597FF; --accent-2:#F29BC4; --accent-soft:rgba(165,151,255,.15);
  --warn:#F2A07A; --warn-soft:rgba(242,160,122,.13);
  --ok:#6BD3A8;
  --phys:#93A9FF; --math:#6FD6BC; --csci:#F7B48E; --hst:#CDA9F5;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -16px rgba(0,0,0,.6);

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* the soft gradient sits on a fixed layer so it doesn't scroll away (iOS ignores background-attachment:fixed) */
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(60vmax 45vmax at 0% 0%, var(--g1), transparent 70%),
    radial-gradient(55vmax 45vmax at 100% 10%, var(--g2), transparent 70%),
    radial-gradient(60vmax 50vmax at 80% 100%, var(--g3), transparent 70%),
    radial-gradient(45vmax 40vmax at 10% 85%, var(--g4), transparent 70%),
    var(--bg);
}
h1,h2,h3{margin:0; font-weight:600; letter-spacing:-.01em}
p{margin:0}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.n{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.wrap{max-width:760px; margin:0 auto; padding:0 18px 80px}
header{position:sticky; top:0; z-index:10;
  background:color-mix(in srgb,var(--bg) 55%,transparent);
  backdrop-filter:blur(22px) saturate(1.4); -webkit-backdrop-filter:blur(22px) saturate(1.4);
  border-bottom:1px solid var(--line)}
.theme{border:1px solid var(--edge); background:var(--card); box-shadow:var(--shadow); width:34px; height:34px; border-radius:12px;
  display:grid; place-items:center; color:var(--ink-2); padding:0}
.theme:hover{color:var(--ink)}
.theme svg{width:17px; height:17px}
.bar{max-width:760px; margin:0 auto; padding:14px 18px 10px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.brand{font-weight:700; font-size:17px; margin-right:auto; letter-spacing:-.01em;
  background:linear-gradient(90deg,var(--accent),var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent}
.tabs,.who{display:flex; gap:2px; padding:3px; border-radius:14px; background:var(--card); border:1px solid var(--edge);
  box-shadow:var(--shadow); backdrop-filter:blur(16px) saturate(1.3); -webkit-backdrop-filter:blur(16px) saturate(1.3)}
.tabs button,.who button{border:0; background:transparent; color:var(--ink-2); padding:6px 13px; border-radius:11px; font-size:14px; transition:background .15s,color .15s}
.tabs button:hover,.who button:hover{color:var(--ink)}
.tabs button[aria-current="page"],.who button[aria-pressed="true"]{color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.who button{font-size:13px; padding:5px 11px}
@media(max-width:560px){
  .bar{gap:8px 10px}
  .tabs{order:3; width:100%}
  .tabs button{flex:1}
}

main{display:flex; flex-direction:column; gap:14px; padding-top:14px}

/* ---------- common ---------- */
.card{background:var(--card); border:1px solid var(--edge); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden;
  backdrop-filter:blur(18px) saturate(1.3); -webkit-backdrop-filter:blur(18px) saturate(1.3)}
.pad{padding:16px 18px}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.small{font-size:13px}
.label{font-size:12px; color:var(--ink-3); font-weight:500}
.dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex:0 0 auto}
.c-phys{background:var(--phys)} .c-math{background:var(--math)} .c-csci{background:var(--csci)} .c-hst{background:var(--hst)} .c-other{background:var(--ink-3)}

.hello{padding:6px 2px 2px}
.hello h1{font-size:26px; letter-spacing:-.02em}
.hello p{margin-top:2px}
.banner{border-radius:14px; padding:11px 14px; font-size:14px; background:var(--card); border:1px solid var(--edge); color:var(--ink-2)}
.banner.warn{background:linear-gradient(135deg,var(--warn-soft),transparent); color:var(--ink)}
.banner b{color:var(--ink)}

/* ---------- day rows ---------- */
.rows{display:flex; flex-direction:column}
.row{display:grid; grid-template-columns:22px 92px 1fr; gap:10px; padding:12px 18px; border-top:1px solid var(--line); align-items:start}
.row:first-child{border-top:0}
.row .tm{font-size:13px; color:var(--ink-2); padding-top:1px}
.row .sub{display:flex; align-items:center; gap:7px; font-weight:600; font-size:14.5px}
.row .what{font-size:13.5px; color:var(--ink-2); margin-top:1px}
.row .list{margin:6px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:3px}
.row .list li{font-size:13px; color:var(--ink-2); display:flex; gap:8px}
.row .list li span:last-child{margin-left:auto; color:var(--ink-3); white-space:nowrap}
.row.cls .sub{font-weight:500; color:var(--ink-2); font-size:14px}
.row.cls .tm{color:var(--ink-3)}
.s-phys{--sc:var(--phys)} .s-math{--sc:var(--math)} .s-csci{--sc:var(--csci)} .s-hst{--sc:var(--hst)}
.row.study{background:linear-gradient(90deg,color-mix(in srgb,var(--sc) 13%,transparent),color-mix(in srgb,var(--sc) 3%,transparent) 75%)}
.row.study .sub .t{color:color-mix(in srgb,var(--sc) 55%,var(--ink))}
.row.exam{background:linear-gradient(90deg,var(--warn-soft),transparent 80%)}
.row.exam .sub{color:var(--warn)}
.row.done{background:transparent}
.row.done .sub,.row.done .what,.row.done .list{opacity:.45}
.row.done .sub span.t{text-decoration:line-through}
.row.skip{opacity:.45; background:transparent}
.row.now{box-shadow:inset 3px 0 0 var(--sc,var(--accent))}
@media(max-width:560px){
  .row{grid-template-columns:22px 1fr; row-gap:2px; padding:11px 14px}
  .row>.tm{grid-column:2; font-size:12.5px}
  .row>div{grid-column:2}
  .row>.tick,.row>.sp{grid-row:1/3}
  .item{padding:9px 14px} .dl .wk{padding-left:14px} .day .dh,.day .note,.day .rest{padding-left:14px; padding-right:14px}
}
.tag{font-size:11px; font-weight:500; color:var(--ink-3); background:var(--soft); border-radius:6px; padding:1px 6px}
.tag.now{color:var(--accent); background:var(--accent-soft)}
.tag.warn{color:var(--warn); background:var(--warn-soft)}

.tick{appearance:none; width:20px; height:20px; border-radius:7px; border:1.5px solid color-mix(in srgb,var(--sc,var(--accent)) 45%,transparent);
  background:var(--card-solid); margin:1px 0 0; padding:0; display:grid; place-items:center; transition:transform .12s}
.tick:hover{border-color:var(--sc,var(--accent))}
.tick:active{transform:scale(.9)}
.tick[aria-checked="true"]{background:linear-gradient(135deg,var(--ok),color-mix(in srgb,var(--ok) 60%,var(--math))); border-color:transparent}
.tick[aria-checked="true"]::after{content:""; width:5px; height:9px; border:solid #fff; border-width:0 2px 2px 0; transform:translate(0,-1px) rotate(45deg)}
.sp{width:20px}

/* ---------- week ---------- */
.day .dh{display:flex; align-items:baseline; gap:8px; padding:13px 18px 11px; border-bottom:1px solid var(--line)}
.day .dh h3{font-size:15px}
.day .dh .r{margin-left:auto; font-size:13px; color:var(--ink-3)}
.day.today{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent), var(--shadow)}
.day .note{padding:10px 18px 0; font-size:13px; color:var(--ink-3)}
.day .rest{padding:14px 18px 16px; font-size:14px; color:var(--ink-2)}
.day .rest ul{margin:8px 0 0; padding-left:18px; color:var(--ink-2); font-size:13.5px}
.summary{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; color:var(--ink-2); padding:0 2px}
.summary span{display:inline-flex; align-items:center; gap:6px}

/* ---------- deadlines ---------- */
.dl .wk{padding:10px 18px 6px; font-size:12px; color:var(--ink-3); font-weight:500; border-top:1px solid var(--line)}
.dl .wk:first-child{border-top:0}
.item{display:grid; grid-template-columns:22px 1fr auto; gap:10px; padding:9px 18px; align-items:start}
.item .t{font-size:14px; display:flex; align-items:baseline; gap:4px 7px; flex-wrap:wrap}
.item .t .dot{align-self:center; margin-top:1px}
.item .t .tt{flex:1 1 60%; min-width:0}
.item .d{font-size:12.5px; color:var(--ink-3); margin-top:1px}
.item .left{font-size:12.5px; color:var(--ink-3); white-space:nowrap; padding-top:2px}
.item .left.soon{color:var(--warn); font-weight:600}
.item.done .t,.item.done .d{opacity:.45; text-decoration:line-through}
.x{border:0; background:none; color:var(--ink-3); font-size:12px; padding:0 0 0 6px}
.x:hover{color:var(--warn)}

details.card>summary{padding:14px 18px; cursor:pointer; list-style:none; font-size:14px; font-weight:500; display:flex; align-items:center; gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+"; margin-left:auto; color:var(--ink-3); font-size:18px; line-height:1}
details.card[open]>summary::after{content:"–"}
details.card .in{padding:0 18px 16px}
.form{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.form .full{grid-column:1/-1}
.form label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-3)}
.form input,.form select{background:var(--soft); border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:14px; width:100%}
.btn{border:0; background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; border-radius:11px; padding:9px 16px; font-size:14px; font-weight:500}
.btn.lite{background:var(--soft); color:var(--ink)}
.rules{margin:4px 0 12px; padding-left:18px; font-size:13.5px; color:var(--ink-2)}
.rules li{margin:3px 0}
.rules b{color:var(--ink); font-weight:600}
.ch{display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; margin-top:10px}
footer{margin-top:28px; font-size:12.5px; color:var(--ink-3); text-align:center}
</style>

function buildDeadlines(){

    const lab=(PHYS_WEEK[w]||{}).lab; if(!lab) return;
    add({id:'ph-l'+lab.n+'-s2', c:'phys', kind:'lab', title:`Physics lab ${lab.n} Stage 2 · ${lab.name}`,
         due:dstr(addDays(parseD(w),7))+'T12:00', note:'No late submission, no extensions.'});
  });
  [['1','2026-09-11','Ch. 1–6'],['2','2026-10-02','Ch. 7–11'],['3','2026-11-06','Ch. 13, 15–17'],['4','2026-11-27','All chapters']]
    .forEach(([n,d,scope])=>add({id:'ph-e'+n, c:'phys', kind:'exam', examN:n, title:`Physics Exam ${n}`, due:d+'T11:00', dur:40,
      note:`${scope}. 40 min in the recitation, LockDown Browser, bring your ID.`}));
  WEEKS.forEach(w=>{
    const mk=MATH_WEEK[w]; if(!mk||!mk.hw) return;
    add({id:'ma-'+mk.hw, c:'math', kind:'hw', title:`WeBWorK ${mk.hw}`, due:dstr(addDays(parseD(w),6))+'T23:59', assumed:true, note:mk.t});

  let labN=1;
  WEEKS.forEach(w=>{
    if(w===BREAK_WEEK||w==='2026-08-17') return;
    add({id:'cs-lab'+labN, c:'csci', kind:'lab', title:`CS lab ${labN}`, due:dstr(addDays(parseD(w),3))+'T21:00', assumed:true});
    labN++;

    const h=HST_WEEK[w]; if(!h||w===BREAK_WEEK||w==='2026-08-17') return;
    add({id:'hs-w'+w, c:'hst', kind:'quiz', people:['l'], title:`History in-class assignment · ${h.t}`,

/* =========================================================================
   HELPERS
   ========================================================================= */
const pad=n=>String(n).padStart(2,'0');
const toMin=s=>{const p=s.split(':');return +p[0]*60 + +p[1]};
const toHM=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const parseDT=s=>{const [d,t]=s.split('T');const a=d.split('-').map(Number);const b=(t||'00:00').split(':').map(Number);
  return new Date(a[0],a[1]-1,a[2],b[0],b[1])};
const addDays=(d,n)=>{const x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x};
const mondayOf=d=>{const x=addDays(d,-((d.getDay()+6)%7)); x.setHours(0,0,0,0); return x};
const dow=d=>((d.getDay()+6)%7)+1;
const DAYN=['','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hrs=m=>m>=60?(m%60?Math.floor(m/60)+'h '+(m%60)+'m':Math.floor(m/60)+'h'):m+'m';
const dayStart=d=>{const x=new Date(d.getTime()); x.setHours(0,0,0,0); return x};
function weekKey(d){const m=dstr(mondayOf(d)); return WEEKS.includes(m)?m:null}
function weekNo(k){const i=WEEKS.indexOf(k); return i<0?null:i+1}
function isLabWeek(k){return !!((PHYS_WEEK[k]||{}).lab)}
function nextWeekKey(k){const i=WEEKS.indexOf(k); if(i<0) return null; let j=i+1; if(WEEKS[j]===BREAK_WEEK) j++; return WEEKS[j]||null}
function untilTxt(due){
  const ms=parseDT(due)-NOW;
  if(ms<0) return {txt:'passed', soon:false};
  const h=ms/36e5;
  if(h<24) return {txt:h<1?Math.max(1,Math.round(h*60))+' min':Math.round(h)+' h', soon:true};
  const days=Math.round((dayStart(parseDT(due))-dayStart(NOW))/864e5);
  return {txt:days===1?'tomorrow':'in '+days+' days', soon:days<=2};
}

const LS='tandem.v1';
let DB=null, writeTimer=null;
let S={done:{}, custom:[], rev:0};
function loadLocal(){ try{const raw=localStorage.getItem(LS); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){} }
function saveLocal(){ try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){} }
function persist(){
  S.rev=(S.rev||0)+1; saveLocal();
  if(!DB) return;
  clearTimeout(writeTimer);
  writeTimer=setTimeout(()=>{ DB.doc('state/shared').set(JSON.parse(JSON.stringify(S))).catch(()=>{}); }, 350);
}
async function initDB(){
  let db=null;
  try{ db = window.claude && claude.use ? await claude.use('db') : null; }catch(e){ db=null; }
  if(!db) return;
  DB=db;
  document.getElementById('foot').textContent='synced between you two';
  DB.doc('state/shared').onSnapshot(snap=>{
    if(!snap.exists){ DB.doc('state/shared').set(JSON.parse(JSON.stringify(S))).catch(()=>{}); return; }
    if(snap.metadata.hasPendingWrites) return;
    const remote=snap.data();
    if((remote.rev||0)>=(S.rev||0)){ S=Object.assign(S,remote); saveLocal(); render(); }
  }, ()=>{ document.getElementById('foot').textContent='saved in this browser'; });
}

/* =========================================================================
   ONE DAY FOR ONE PERSON: classes, exams and study blocks
   ========================================================================= */
function classesOn(p,date){
  const k=weekKey(date);
  if(!k||k===BREAK_WEEK||HOLIDAYS[dstr(date)]) return [];
  const lab=isLabWeek(k);
  return CLASSES[p].filter(c=>c.d===dow(date) && (!c.labWeek||lab))
    .map(c=>Object.assign({},c,{sm:toMin(c.s),em:toMin(c.e)}));
}
function examsOn(p,date){
  return allItems().filter(it=>it.kind==='exam' && it.people.includes(p) && it.due.slice(0,10)===dstr(date))
    .map(it=>{const sm=toMin(it.due.slice(11)); return Object.assign({},it,{sm, em:sm+(it.dur||90)});});
}

/* the week's history load, spread over the four reading blocks before the seminar */
const HST_ORDER=['thu','fri','sat','mon'];
function hstSlots(k){
  const h=HST_WEEK[k], out={thu:[],fri:[],sat:[],mon:[]};
  if(!h) return out;
  const items=h.lec.map(x=>({kind:'lecture',t:x[0],m:x[1]})).concat(h.read.map(x=>({kind:'reading',t:x[0],m:x[1]})));
  items.forEach((it,i)=>out[HST_ORDER[Math.floor(i*4/items.length)]].push(it));
  return out;
}
/* Thu/Fri/Sat read ahead for next week's seminar; Mon/Tue/Wed finish this week's */
function hstTarget(slot,k){ return (slot==='thu'||slot==='fri'||slot==='sat') ? nextWeekKey(k) : k; }

const PREP={
  phys:'Timed problems from the chapters on the exam. Check the units on every answer',
  math:'Past-exam problems with no calculator, then redo the ones you missed',
  hst:'Midterm drill: for each likely question write a thesis, 3 arguments, 1 counterargument and the evidence'
};

function blocksOn(p,date){
  const i=dow(date)-1, day=ROUTINE[p][i], k=weekKey(date);
  if(!day||day.rest) return [];
  const lab=k?isLabWeek(k):false;
  const exams=allItems().filter(it=>it.kind==='exam' && it.people.includes(p));
  return day.blocks.map((b,bi)=>{
    const [s,e]=(!lab && b.nolab) ? b.nolab : [b.s,b.e];
    const start=parseDT(dstr(date)+'T'+s);
    const out={c:b.c, sm:toMin(s), em:toMin(e), s, e, slot:!!b.slot, key:'rt:'+p+':'+dstr(date)+':'+bi,
               what:b.what||'', list:null, tag:null};

    // an exam coming up in this subject changes what the block is for
    const ex=exams.find(x=>x.c===b.c && parseDT(x.due)>start && (dayStart(parseDT(x.due))-dayStart(date))/864e5<=6);
    const exDays=ex?Math.round((dayStart(parseDT(ex.due))-dayStart(date))/864e5):null;

    if(b.hst){
      const tk=hstTarget(b.hst,k);
      const sem=tk?addDays(parseD(tk),2):null;
      if(ex && exDays<=3 && HST_ORDER.includes(b.hst) && b.hst!=='mon'){
        out.what=PREP.hst; out.tag={t:ex.title+(exDays===0?' today':exDays===1?' tomorrow':' in '+exDays+' days'), warn:true};
      }else if(b.hst==='drill'){
        out.what='Closed-book recall: define the week’s terms, one line of evidence per source, then write a 150-word answer';
        out.tag={t:'seminar 14:00'};
      }else if(b.hst==='consolidate'){
        out.what='Finish any reading left, write the week’s terms, draft the answer you would give tomorrow';
      }else if(tk && HST_WEEK[tk] && HST_WEEK[tk].lec.length){
        out.list=hstSlots(tk)[b.hst];
        out.what='For '+DAYN[3].slice(0,3)+' '+sem.getDate()+' '+MON[sem.getMonth()]+': '+HST_WEEK[tk].t;
        if(!out.list.length) out.what+=' · re-read your notes';
      }else{
        out.what='Go back over your notes from earlier weeks';
      }
      return out;
    }
    if(ex && PREP[b.c]){
      out.what = exDays===0 ? 'Light review only. Formulas and definitions, nothing new' : PREP[b.c];
      out.tag = {t:ex.title+(exDays===0?' today':exDays===1?' tomorrow':' in '+exDays+' days'), warn:true};
      if(b.lab && lab) out.what+='. Stage 2 of Monday’s lab is still due';
    }else if(b.c==='phys' && k && PHYS_WEEK[k]){
      out.topic=PHYS_WEEK[k].t;
    }else if(b.c==='math' && k && MATH_WEEK[k]){
      out.topic=MATH_WEEK[k].t;
    }
    return out;
  });
}

function dayPlan(p,date){
  const classes=classesOn(p,date), exams=examsOn(p,date);
  const blocks=blocksOn(p,date);
  // a recitation used as a study slot is not shown as a class; an exam replaces the class it sits in
  const shownClasses=classes.filter(c=>
    !blocks.some(b=>b.slot && b.sm<c.em && c.sm<b.em) &&
    !exams.some(x=>x.sm<c.em && c.sm<x.em));
  // study blocks that collide with an exam are skipped that day
  blocks.forEach(b=>{ if(exams.some(x=>b.sm<x.em+15 && x.sm-15<b.em)) b.skip=true; });
  return {classes:shownClasses, exams, blocks, rest:!!(ROUTINE[p][dow(date)-1]||{}).rest,
          routine:ROUTINE[p][dow(date)-1]};
}

function rowsHtml(p,date,pl,live){
  const nowMin=NOW.getHours()*60+NOW.getMinutes();
  const rows=[];
  pl.classes.forEach(c=>rows.push({sm:c.sm, html:
    '<div class="row cls"><span class="sp"></span><span class="tm n">'+c.s+'–'+c.e+'</span><div>'
    +'<div class="sub"><span class="dot c-'+c.c+'"></span>'+esc(c.t)+'</div>'
    +'<div class="what faint">'+esc(c.room)+'</div></div></div>'}));
  pl.exams.forEach(x=>rows.push({sm:x.sm-1, html:
    '<div class="row exam"><span class="sp"></span><span class="tm n">'+toHM(x.sm)+'</span><div>'
    +'<div class="sub"><span class="dot c-'+x.c+'"></span>'+esc(x.title)+'</div>'
    +'<div class="what">'+esc(x.note||'')+'</div></div></div>'}));
  let nextMarked=false;
  pl.blocks.forEach(b=>{
    const done=isDone(b.key);
    let cls='row study s-'+b.c; let state='';
    if(b.skip) cls+=' skip';
    if(done) cls+=' done';
    if(live && !b.skip && !done){
      if(nowMin>=b.sm && nowMin<b.em){ cls+=' now'; state='<span class="tag now">now</span>'; nextMarked=true; }
      else if(!nextMarked && b.sm>nowMin){ state='<span class="tag now">next</span>'; nextMarked=true; }
    }
    const tag = b.skip ? '<span class="tag warn">skip, exam</span>'
      : b.tag ? '<span class="tag'+(b.tag.warn?' warn':'')+'">'+esc(b.tag.t)+'</span>' : '';
    rows.push({sm:b.sm, html:
      '<div class="'+cls+'">'+(b.skip?'<span class="sp"></span>':tick(b.key,done))
      +'<span class="tm n">'+b.s+'–'+b.e+'</span><div>'
      +'<div class="sub"><span class="dot c-'+b.c+'"></span><span class="t">'+COURSES[b.c].name+'</span>'
      +'<span class="faint small n" style="font-weight:400">'+hrs(b.em-b.sm)+'</span>'+state+tag+'</div>'
      +(b.what?'<div class="what">'+esc(b.what)+'</div>':'')
      +(b.topic?'<div class="what faint small">'+esc(b.topic)+'</div>':'')
      +(b.list&&b.list.length?'<ul class="list">'+b.list.map(it=>'<li><span>'+(it.kind==='lecture'?'▶':'📄')+'</span><span>'+esc(it.t)
        +'</span><span class="n">'+it.m+'m</span></li>').join('')+'</ul>':'')
      +'</div></div>'});
  });
  return rows.sort((a,b)=>a.sm-b.sm).map(r=>r.html).join('');
}

function studyMin(pl){ return pl.blocks.filter(b=>!b.skip).reduce((a,b)=>a+(b.em-b.sm),0); }

function bannersFor(p,mon){
  const k=dstr(mon); let h='';
  if(k===BREAK_WEEK) h+='<div class="banner"><b>Fall break.</b> No classes this week. Keep the routine light and catch up on anything left over.</div>';
  if(!WEEKS.includes(k) && mon>parseD(WEEKS[WEEKS.length-1])) h+='<div class="banner">Teaching weeks are over. Check Deadlines for finals.</div>';
  const end=dstr(addDays(mon,6));
  const ex=allItems().filter(it=>it.kind==='exam'&&it.people.includes(p)&&it.due.slice(0,10)>=k&&it.due.slice(0,10)<=end);
  if(ex.length) h+='<div class="banner warn"><b>Exam week:</b> '+ex.map(e=>esc(e.title)+' '+DAYN[dow(parseDT(e.due))].slice(0,3)+' '+e.due.slice(11)).join(' · ')
    +'. Blocks for these subjects switch to exam prep automatically.</div>';
  return h;
}

/* ---------- TODAY ---------- */
function vToday(){
  const p=WHO, pl=dayPlan(p,NOW), k=weekKey(NOW), wn=weekNo(k);
  const total=studyMin(pl), live=pl.blocks.filter(b=>!b.skip);
  const doneN=live.filter(b=>isDone(b.key)).length;
  const upcoming=allItems().filter(it=>it.people.includes(p)&&!isDone(it.id)&&parseDT(it.due)>NOW);
  const week=upcoming.filter(it=>parseDT(it.due)-NOW<7*864e5);

  let h='<section class="hello"><h1>'+DAYN[dow(NOW)]+', '+NOW.getDate()+' '+MON[NOW.getMonth()]+'</h1>'
    +'<p class="muted">'+(wn?'Week '+wn+' · ':'')
    +(pl.rest?'Rest day':total?hrs(total)+' of study · '+doneN+' of '+live.length+' done':'No study blocks today')
    +(HOLIDAYS[dstr(NOW)]?' · '+HOLIDAYS[dstr(NOW)]:'')+'</p></section>';
  h+=bannersFor(p,mondayOf(NOW));

  if(pl.rest){
    h+='<section class="card day"><div class="rest">'+esc(pl.routine.note)
      +'<ul>'+pl.routine.checks.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul></div></section>';
  }else{
    h+='<section class="card rows">'+(rowsHtml(p,NOW,pl,true)||'<div class="row"><span class="sp"></span><span></span><span class="muted">Nothing scheduled.</span></div>')+'</section>';
  }

  if(week.length){
    h+='<section class="card dl"><div class="wk">Due in the next 7 days</div>'
      +week.map(itemHtml).join('')+'</section>';
  }
  return h;
}

/* ---------- WEEK ---------- */
function vWeek(){
  const p=WHO, mon=mondayOf(NOW), k=dstr(mon), wn=weekNo(k);
  const days=[0,1,2,3,4,5,6].map(n=>addDays(mon,n));
  const plans=days.map(d=>dayPlan(p,d));
  const by={}; let total=0;
  plans.forEach(pl=>pl.blocks.forEach(b=>{ if(b.skip) return; by[b.c]=(by[b.c]||0)+(b.em-b.sm); total+=b.em-b.sm; }));
  const items=allItems().filter(it=>it.people.includes(p));

  let h='<section class="hello"><h1>Week of '+mon.getDate()+' '+MON[mon.getMonth()]+'</h1>'
    +'<p class="muted">'+(wn?'Semester week '+wn+' · ':'')+hrs(total)+' of study</p></section>';
  h+='<div class="summary">'+Object.keys(by).sort((a,b)=>by[b]-by[a])
    .map(c=>'<span><span class="dot c-'+c+'"></span>'+COURSES[c].name+' <span class="n">'+hrs(by[c])+'</span></span>').join('')+'</div>';
  h+=bannersFor(p,mon);

  days.forEach((d,i)=>{
    const pl=plans[i], today=dstr(d)===dstr(NOW);
    const due=items.filter(it=>it.kind!=='exam'&&it.due.slice(0,10)===dstr(d));
    h+='<section class="card day'+(today?' today':'')+'"><div class="dh"><h3>'+DAYN[dow(d)]+'</h3>'
      +'<span class="faint small n">'+d.getDate()+' '+MON[d.getMonth()]+'</span>'
      +(today?'<span class="tag now">today</span>':'')
      +'<span class="r n">'+(pl.rest?'rest':hrs(studyMin(pl)))+'</span></div>';
    if(due.length) h+='<div class="note">'+due.map(it=>'<span class="tag'+(isDone(it.id)?'':' warn')+'">due '+it.due.slice(11)+' · '+esc(it.title.split(' · ')[0])+'</span>').join(' ')+'</div>';
    if(pl.rest){
      h+='<div class="rest">'+esc(pl.routine.note)+'<ul>'+pl.routine.checks.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul></div>';
    }else{
      if(pl.routine.note) h+='<div class="note">'+esc(pl.routine.note)+'</div>';
      h+='<div class="rows">'+rowsHtml(p,d,pl,false)+'</div>';
    }
    h+='</section>';
  });
  return h;
}

/* ---------- DEADLINES ---------- */
function itemHtml(it){
  const done=isDone(it.id), dt=parseDT(it.due), u=untilTxt(it.due);
  return '<div class="item s-'+(COURSES[it.c]?it.c:'other')+(done?' done':'')+'">'+tick(it.id,done)
    +'<div><div class="t"><span class="dot c-'+(COURSES[it.c]?it.c:'other')+'"></span><span class="tt">'+esc(it.title)+'</span>'
    +(it.kind==='exam'?' <span class="tag warn">exam</span>':'')
    +(it.assumed?' <span class="tag">date assumed</span>':'')
    +(it.custom?'<button class="x" data-del="'+it.id+'">remove</button>':'')+'</div>'
    +'<div class="d n">'+DAYN[dow(dt)].slice(0,3)+' '+dt.getDate()+' '+MON[dt.getMonth()]+', '+it.due.slice(11)
    +(it.note?' · '+esc(it.note):'')+'</div></div>'
    +'<span class="left'+(u.soon&&!done?' soon':'')+'">'+u.txt+'</span></div>';
}
function vDue(){
  const p=WHO;
  const items=allItems().filter(it=>it.people.includes(p) && parseDT(it.due)>=dayStart(NOW));
  const groups={};
  items.forEach(it=>{ const k=dstr(mondayOf(parseDT(it.due))); (groups[k]=groups[k]||[]).push(it); });

  let h='<section class="hello"><h1>Deadlines</h1><p class="muted">'+PEOPLE[p].name+' · everything still ahead</p></section>';

  h+='<details class="card"><summary>Add a deadline</summary><div class="in"><div class="form">'
   +'<label class="full">What<input type="text" id="nTitle" placeholder="CS lab 5"></label>'
   +'<label>Course<select id="nCourse">'+PEOPLE[p].courses.map(c=>'<option value="'+c+'">'+COURSES[c].name+'</option>').join('')+'<option value="other">Other</option></select></label>'
   +'<label>For<select id="nWho"><option value="'+p+'">'+PEOPLE[p].name+'</option><option value="both">Both of us</option></select></label>'
   +'<label>Date<input type="date" id="nDate" value="'+dstr(addDays(NOW,3))+'"></label>'
   +'<label>Time<input type="time" id="nTime" value="21:00"></label>'
   +'<div class="full"><button class="btn" id="addItem">Add</button></div>'
   +'</div></div></details>';

  const keys=Object.keys(groups).sort();
  h+='<section class="card dl">';
  if(!keys.length) h+='<div class="item"><span></span><span class="muted">Nothing left.</span></div>';
  keys.forEach(k=>{
    const m=parseD(k), wn=weekNo(k);
    h+='<div class="wk">'+(k===BREAK_WEEK?'Fall break':'Week of '+m.getDate()+' '+MON[m.getMonth()])+(wn&&k!==BREAK_WEEK?' · week '+wn:'')+'</div>'
      +groups[k].map(itemHtml).join('');
  });
  h+='</section>';

  h+='<details class="card"><summary>Course rules worth knowing</summary><div class="in">'
    +PEOPLE[p].courses.map(c=>'<div class="ch"><span class="dot c-'+c+'"></span>'+COURSES[c].name+' <span class="faint small" style="font-weight:400">'+COURSES[c].code+'</span></div>'
      +'<ul class="rules">'+RULES[c].map(r=>'<li>'+r+'</li>').join('')+'</ul>').join('')
    +'</div></details>';
  return h;
}

const VIEWS=[['today','Today'],['week','Week'],['due','Deadlines']];
function render(){
  NOW=new Date();
  document.getElementById('tabs').innerHTML=VIEWS.map(([id,l])=>'<button data-view="'+id+'"'+(VIEW===id?' aria-current="page"':'')+'>'+l+'</button>').join('');
  document.getElementById('who').innerHTML=['l','y'].map(p=>'<button data-who="'+p+'" aria-pressed="'+(WHO===p)+'">'+PEOPLE[p].name+'</button>').join('');
  document.getElementById('main').innerHTML = VIEW==='today'?vToday(): VIEW==='week'?vWeek(): vDue();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-view],[data-who],[data-tick],[data-del],#addItem,#theme');
  if(!t) return;
  if(t.id==='theme'){
    const next=isDark()?'light':'dark';
    document.documentElement.dataset.theme=next;
    try{localStorage.setItem('tandem.theme',next)}catch(err){}
    paintTheme(); return;
  }
  if(t.dataset.view){ VIEW=t.dataset.view; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.who){ WHO=t.dataset.who; try{localStorage.setItem('tandem.who',WHO)}catch(err){} render(); return; }
  if(t.dataset.tick){ toggleDone(t.dataset.tick); return; }
  if(t.dataset.del){ S.custom=(S.custom||[]).filter(c=>c.id!==t.dataset.del); persist(); render(); return; }
  if(t.id==='addItem'){
    const title=document.getElementById('nTitle').value.trim(); if(!title) return;
    const who=document.getElementById('nWho').value;
    S.custom=(S.custom||[]).concat([{id:'x'+Date.now(), title, c:document.getElementById('nCourse').value,
      due:document.getElementById('nDate').value+'T'+document.getElementById('nTime').value,
      people: who==='both'?['y','l']:[who]}]);
    persist(); render();
  }
});

loadLocal();
render();
paintTheme();
initDB();
setInterval(()=>{ if(VIEW==='today' && !document.querySelector('input:focus')) render(); }, 60000);
</script>
